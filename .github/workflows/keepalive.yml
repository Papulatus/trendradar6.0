name: Keep Scheduled Workflows Active

# GitHub can disable scheduled workflows in public repositories after 60 days
# without repository activity. This job creates a small, idempotent activity
# commit only when the marker is at least 30 days old.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Refresh activity marker when due
        shell: bash
        run: |
          set -euo pipefail
          marker=.github/.keepalive
          now=$(date -u +%s)
          last=0
          if [[ -f "$marker" ]]; then
            last=$(date -u -d "$(cat "$marker")" +%s 2>/dev/null || echo 0)
          fi
          if (( now - last < 2592000 )); then
            echo "Marker is less than 30 days old; no commit needed."
            exit 0
          fi
          date -u +%FT%TZ > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "chore: keep scheduled workflows active"
          git push
