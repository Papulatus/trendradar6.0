name: Check In

# ✅ 自动续期：每天清理超过 1 天的历史运行，持续重置 7 天计时
# ✅ Auto-renewal: daily cleanup of runs older than one day resets the 7-day timer
#
# 保留最近运行及其 24 小时报表 Artifact；无需手动签到。

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动续期
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"