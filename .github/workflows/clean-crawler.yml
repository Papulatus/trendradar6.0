name: Check In

# Preserve Actions/report history. A real monthly repository commit prevents
# GitHub's scheduled-workflow inactivity suspension; deleting run history does not.
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendradar-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
      - name: Record monthly repository activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled TrendRadar reports active"
          git push origin HEAD:master
